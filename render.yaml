# One-click deploy on Render (https://render.com): New > Blueprint > select this repo.
services:
  - type: web
    name: research-tracker
    runtime: docker
    plan: starter
    healthCheckPath: /healthz/
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: DEBUG
        value: "0"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: TIME_ZONE
        value: Asia/Amman
      - key: DATABASE_URL
        fromDatabase:
          name: research-tracker-db
          property: connectionString
      - key: SITE_URL
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
    disk:
      name: media
      mountPath: /app/media
      sizeGB: 1

databases:
  - name: research-tracker-db
    plan: free
