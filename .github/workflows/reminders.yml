# Triggers the email reminders on your deployed site from GitHub's scheduler.
# Setup (Settings > Secrets and variables > Actions):
#   SITE_URL     e.g. https://research.example.edu   (repository *variable*)
#   CRON_SECRET  same value as the server's CRON_SECRET (repository *secret*)
# Not needed if you use docker-compose (it has its own scheduler service).
name: Email reminders
on:
  schedule:
    - cron: "17 * * * *"       # hourly reminders
    - cron: "41 4 * * 0"       # weekly digest, Sunday 07:41 Amman time
  workflow_dispatch:

jobs:
  ping:
    if: ${{ vars.SITE_URL != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Reminders
        run: curl -fsS -X POST -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}" "${{ vars.SITE_URL }}/cron/reminders/"
      - name: Weekly digest
        if: github.event.schedule == '41 4 * * 0'
        run: curl -fsS -X POST -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}" "${{ vars.SITE_URL }}/cron/digest/"
