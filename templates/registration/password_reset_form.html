{% extends "registration/_auth_base.html" %}{% load i18n %}
{% block auth %}<h3 class="fw-bold mb-3">{% trans "Reset password" %}</h3>
<p class="text-muted-rt small">{% trans "Enter your email and we will send you a reset link." %}</p>
<form method="post">{% csrf_token %}<input type="email" name="email" class="form-control form-control-lg mb-3" required placeholder="name@university.edu">
<button class="btn btn-primary btn-lg w-100">{% trans "Send reset link" %}</button></form>
<p class="text-center small mt-3"><a href="{% url 'login' %}">{% trans "Back to log in" %}</a></p>{% endblock %}
