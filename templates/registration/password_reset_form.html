{% extends "registration/_auth_base.html" %}{% load i18n %}
{% block auth %}<div class="empty p-0 text-start"><div class="ic mx-0"><i class="bi bi-key"></i></div></div>
<h1 class="fw-bold mb-1">{% trans "Reset password" %}</h1>
<p class="text-muted-rt mb-4">{% trans "Enter your email and we will send you a reset link." %}</p>
<form method="post">{% csrf_token %}<div class="input-icon mb-3"><i class="bi bi-envelope"></i><input type="email" name="email" class="form-control form-control-lg" required placeholder="name@university.edu"></div>
<button class="btn btn-primary btn-lg w-100">{% trans "Send reset link" %}</button></form>
<p class="text-center small mt-4"><a href="{% url 'login' %}"><i class="bi bi-arrow-left"></i> {% trans "Back to log in" %}</a></p>{% endblock %}
