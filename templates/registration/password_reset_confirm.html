{% extends "registration/_auth_base.html" %}{% load i18n %}
{% block auth %}<h1 class="fw-bold mb-4">{% trans "Choose a new password" %}</h1>
{% if validlink %}<form method="post" novalidate>{% csrf_token %}{% include "includes/form_fields.html" with full=1 %}<button class="btn btn-primary btn-lg w-100 mt-4">{% trans "Save password" %}</button></form>
{% else %}<div class="alert alert-danger">{% trans "This reset link is invalid or has expired." %}</div>{% endif %}{% endblock %}
