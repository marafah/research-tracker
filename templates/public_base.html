{% extends "base.html" %}{% load i18n %}
{% block shell %}{% get_current_language as LANG %}
<div class="min-vh-100 d-flex flex-column" style="background: var(--rt-bg)">
  <header class="d-flex align-items-center justify-content-between px-3 px-md-4 py-3">
    <a href="/" class="d-flex align-items-center gap-2 fw-bold text-decoration-none" style="color: var(--rt-text)">
      <span class="sb-logo" style="width:34px;height:34px;font-size:1rem"><i class="bi bi-journal-bookmark-fill"></i></span> {{ SITE_NAME }}</a>
    <form action="{% url 'set_language' %}" method="post" class="m-0">{% csrf_token %}
      <input type="hidden" name="next" value="{{ request.get_full_path }}">
      <input type="hidden" name="language" value="{% if LANG == 'ar' %}en{% else %}ar{% endif %}">
      <button class="btn btn-ghost btn-sm"><i class="bi bi-translate"></i> {% if LANG == 'ar' %}English{% else %}العربية{% endif %}</button>
    </form>
  </header>
  <main class="public-wrap flex-grow-1 w-100">{% block public_content %}{% endblock %}</main>
  <footer class="text-center small text-muted-rt py-4"><i class="bi bi-shield-lock"></i> {{ SITE_NAME }} · {% trans "Open-source research publication tracker" %}</footer>
</div>
{% endblock %}
