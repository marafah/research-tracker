{% extends "base.html" %}{% load i18n %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-6"><div class="card"><div class="card-body">
  <h4>{% trans "Delete" %} “{{ object }}”?</h4>
  <p class="text-muted-rt">{% trans "This permanently deletes it with all submissions, deadlines, comments and files." %}</p>
  <form method="post">{% csrf_token %}
    <button class="btn btn-danger">{% trans "Yes, delete" %}</button>
    <a class="btn btn-link" href="{{ back.get_absolute_url }}">{% trans "Cancel" %}</a>
  </form>
</div></div></div></div>
{% endblock %}
