{% extends "base.html" %}{% load i18n %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-7 col-lg-5"><div class="card mt-4">
  <div class="card-body p-4 text-center">
    <div class="empty p-0"><div class="ic tone-danger"><i class="bi bi-trash3"></i></div></div>
    <h5 class="fw-bold">{% trans "Delete" %} “{{ object }}”?</h5>
    <p class="text-muted-rt small">{% trans "This permanently deletes it with all submissions, deadlines, comments and files." %}</p>
    <form method="post" class="d-flex gap-2 justify-content-center mt-3">{% csrf_token %}
      <a class="btn btn-ghost" href="{{ back.get_absolute_url }}">{% trans "Cancel" %}</a>
      <button class="btn btn-danger"><i class="bi bi-trash3"></i> {% trans "Yes, delete" %}</button>
    </form>
  </div></div></div></div>
{% endblock %}
