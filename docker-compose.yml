# One command to run everything:  docker compose up -d
# Then create your admin account:  docker compose exec web python manage.py createsuperuser
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tracker
      POSTGRES_USER: tracker
      POSTGRES_PASSWORD: tracker
    volumes: [pgdata:/var/lib/postgresql/data]
    restart: unless-stopped

  web:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://tracker:tracker@db:5432/tracker
    ports: ["8000:8000"]
    volumes: [media:/app/media]
    depends_on: [db]
    restart: unless-stopped

  # Sends reminders every hour and the weekly digest (guarded to once a week per user).
  scheduler:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://tracker:tracker@db:5432/tracker
    command: sh -c "while true; do python manage.py send_reminders; python manage.py send_digest; sleep 3600; done"
    depends_on: [web]
    restart: unless-stopped

volumes:
  pgdata:
  media:
